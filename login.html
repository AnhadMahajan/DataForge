<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — DataForge</title>
  <meta name="description" content="Log in to DataForge — Synthetic Data Intelligence Engine.">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth-page">
  <div class="auth-card" id="login-card">
    <div class="auth-logo">
      <a href="index.html" class="auth-logo-text">Data<span>Forge</span></a>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Enter your credentials to access your workspace</p>

    <form class="auth-form" id="login-form" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="input" 
          placeholder="name@organization.com" 
          autocomplete="email"
          required
        >
        <div class="form-error hidden" id="email-error"></div>
      </div>

      <div class="form-group">
        <div class="flex items-center justify-between mb-xs">
          <label for="password" class="form-label m-0">Password</label>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="input" 
          placeholder="••••••••" 
          autocomplete="current-password"
          required
        >
        <div class="form-error hidden" id="password-error"></div>
      </div>

      <div class="auth-options">
        <label class="checkbox-group">
          <input type="checkbox" id="remember" class="checkbox" checked>
          <span class="checkbox-label">Keep me signed in</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
        <span>Log in</span>
      </button>

      <button type="button" class="btn btn-secondary auth-submit mt-sm" id="btn-demo-login">
        <span>⚡ Launch Demo Workspace</span>
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-footer-text">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
